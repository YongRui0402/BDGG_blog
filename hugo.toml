baseURL = "https://yongrui0402.github.io/BDGG_blog/"
title = "BDGG"
locale = "zh-Hant-TW"
defaultContentLanguage = "zh-tw"
# 中文沒有空白分詞,不開的話閱讀時間與字數會把一整段算成一個字
hasCJKLanguage = true
# 文章日期沒寫時區時用這個,本機與 CI 才會建出一樣的成品
timeZone = "Asia/Taipei"

# 標籤頁的標題照作者寫的樣子顯示。預設(true)會把第一個字母改成大寫:mod → Mod、iOS → IOS。
capitalizeListTitles = false
# 版型在 layouts/robots.txt。sitemap 用 Hugo 內建的版型,輸出在 /sitemap.xml
enableRobotsTXT = true

# 只有首頁出 RSS(/index.xml,全站最新的文章)。分區頁與標籤頁明寫成只出 HTML:
# 不寫的話 Hugo 預設每個分區、每個標籤各出一份 feed,而 layouts/_default/rss.xml
# 收的是全站文章,每一份的內容都會一模一樣。
[outputs]
  home = ["html", "rss"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

[params]
  # tagline 出現在每一頁的頁首與首頁;description 是給搜尋引擎與社群分享看的說明文字。
  # 兩者都描述「這裡有什麼內容」。
  # 改了 tagline 要重畫分享圖:python3 scripts/make_og_image.py
  tagline = "技術筆記、學習心得，與做過的專案"
  description = "BDGG 的技術筆記、課程與學習心得、專案紀錄與隨筆。"
  # 筆名。每一頁的作者欄與 RSS 的作者都用它;這個人是誰、怎麼聯絡,寫在關於頁(content/about.md)。
  author = "BDGG"
  # GitHub 帳號,頁尾的連結用
  github = "YongRui0402"
  # 文章超過這個月數沒更新,文首會自動掛上「內容可能已過期」的提示
  staleAfterMonths = 12

# 只有標籤一種分類法。不寫的話 Hugo 預設還會多產生一個空的 /categories/。
# 標籤總覽在 /tags/,每個標籤的頁面在 /tags/<標籤>/。
[taxonomies]
  tag = "tags"

# 分類頁與標籤頁一頁列 10 篇。超過一頁時排序按鈕不會出現(它只能重排當頁的項目)。
[pagination]
  pagerSize = 10

# GA4:ID 留空就不輸出追蹤碼。要啟用時填上 G- 開頭的評估 ID。
[services]
  [services.googleAnalytics]
    ID = ""

# 文章網址是 /<分區>/<slug>/。front matter 沒寫 slug 時用檔名,
# 不會退而用標題(:slug 會,中文標題就變成中文網址)。
[permalinks]
  [permalinks.page]
    pitfalls  = "/pitfalls/:slugorcontentbasename/"
    decisions = "/decisions/:slugorcontentbasename/"
    projects  = "/projects/:slugorcontentbasename/"
    notes     = "/notes/:slugorcontentbasename/"
    learning  = "/learning/:slugorcontentbasename/"
    life      = "/life/:slugorcontentbasename/"

[markup]
  [markup.goldmark]
    # 站台在子路徑底下,內文裡的站內連結與圖片要由 Hugo 解析成完整路徑:
    # [字](/learning/某篇/) 與 [字](某篇.md) 都會變成 /BDGG_blog/learning/某篇/。
    # 預設(auto)只在多語系站台才解析,所以這裡寫 always。
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.link]
        useEmbedded = "always"
      [markup.goldmark.renderHooks.image]
        useEmbedded = "always"
  [markup.highlight]
    # 產出 class 而不是行內樣式,顏色由 assets/css/syntax.css 決定,才能跟著深色模式切換
    noClasses = false
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# 選單一律用 pageRef 指向頁面,不寫 url —— 站台在子路徑底下。
# 項目跟著功能進來:頁面存在了才掛上選單。
# 名稱不寫,取自該頁的 title(分類是 content/<分類>/_index.md)。
# 六個分類都列在這裡,但還沒有文章的那幾個不會顯示(layouts/partials/menu.html),
# 所以某個分類的第一篇文章發出去時,不必回來改這一段。
# 「最新」與「關於」是 content/ 根目錄的單頁,不是分類,一律顯示 ——
# 所以它們指向的頁面不能是草稿(選單會留下一個空的連結,make check 會擋)。
[[menus.main]]
  name = "最新"
  pageRef = "/latest"
  weight = 5
[[menus.main]]
  pageRef = "/pitfalls"
  weight = 10
[[menus.main]]
  pageRef = "/decisions"
  weight = 20
[[menus.main]]
  pageRef = "/projects"
  weight = 30
[[menus.main]]
  pageRef = "/notes"
  weight = 40
[[menus.main]]
  pageRef = "/learning"
  weight = 41
[[menus.main]]
  pageRef = "/life"
  weight = 42
[[menus.main]]
  pageRef = "/about"
  weight = 50
