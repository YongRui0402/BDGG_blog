{{ define "main" }}
<header class="list-head">
  <h1>找不到這個頁面</h1>
</header>

<div class="content">
  <p>網址可能打錯了，或者這篇文章被改過網址。</p>
  {{- /* 這一頁會出現在任意深度的網址上，連結一定要是從網域根算起的路徑。
         選單裡的項目（有文章的分類、最新）都是。 */}}
  <p>
    <a href="{{ site.Home.RelPermalink }}">回首頁</a>
    {{- range partial "menu.html" . }} ·
    <a href="{{ .URL }}">{{ .Name }}</a>
    {{- end }}
  </p>
</div>
{{ end }}
