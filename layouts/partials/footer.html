<footer class="site-foot">
  <div class="wrap">
    <p>
      {{ site.Title }} ·
      <a href="https://github.com/{{ site.Params.github }}" rel="me noopener">GitHub</a>
      {{- with site.GetPage "/tags" }} ·
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{- end }}
      {{- with site.Home.OutputFormats.Get "rss" }} ·
      <a href="{{ .RelPermalink }}">RSS</a>
      {{- end }}
    </p>
    <p class="muted">
      內容以實測為準，環境不同結果可能不同。引用請註明出處。
    </p>
  </div>
</footer>
